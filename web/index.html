<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>devflow</title>
<style>
  :root {
    --bg: #f4f5f7; --surface: #fff; --text: #1d2129; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2f55d4; --accent-soft: #e8eefc; --good: #15803d; --good-soft: #e7f6ec;
    --warn: #b45309; --warn-soft: #fdf3e2; --bad: #b91c1c; --bad-soft: #fdecec; --ax: #7c3aed; --ax-soft: #f1eafe;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318; --surface: #1b1e25; --text: #e7e9ee; --muted: #9aa1ad; --line: #2b2f38;
      --accent: #7f9cff; --accent-soft: #232b45; --good: #4ade80; --good-soft: #17301f;
      --warn: #fbbf24; --warn-soft: #33290f; --bad: #f87171; --bad-soft: #3a1a1a; --ax: #b794ff; --ax-soft: #2a2140;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
  header { position: sticky; top: 0; z-index: 1; background: var(--surface); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1120px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .logo { font-weight: 700; font-size: 16px; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav button { white-space: nowrap; }
  nav button, .chip { border: 1px solid var(--line); background: transparent; color: var(--text); padding: 6px 12px; border-radius: 999px; cursor: pointer; font: inherit; }
  nav button.on, .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .spacer { flex: 1; }
  main { max-width: 1120px; margin: 0 auto; padding: 20px 16px 48px; }
  h2 { font-size: 16px; margin: 24px 0 10px; }
  h2:first-child { margin-top: 0; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .tile b { display: block; font-size: 26px; }
  .tile span { color: var(--muted); font-size: 13px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .card h3 { margin: 6px 0 8px; font-size: 15px; }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 12px; }
  .badge { display: inline-block; white-space: nowrap; padding: 1px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; background: var(--line); color: var(--text); }
  .b-high { background: var(--bad-soft); color: var(--bad); } .b-medium { background: var(--warn-soft); color: var(--warn); } .b-low { background: var(--good-soft); color: var(--good); }
  .b-app { background: var(--accent-soft); color: var(--accent); } .b-ax { background: var(--ax-soft); color: var(--ax); }
  .b-status { background: transparent; border: 1px solid var(--line); color: var(--muted); font-weight: 500; }
  dl { margin: 8px 0 0; display: grid; grid-template-columns: 72px 1fr; gap: 4px 12px; }
  dt { color: var(--muted); font-size: 13px; } dd { margin: 0; white-space: pre-wrap; word-break: break-word; }
  code { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg); padding: 1px 5px; border-radius: 4px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .btn { border: 1px solid var(--line); background: var(--surface); color: var(--text); padding: 6px 12px; border-radius: 8px; cursor: pointer; font: inherit; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:focus-visible, nav button:focus-visible, .chip:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input, select { border: 1px solid var(--line); background: var(--surface); color: var(--text); padding: 6px 10px; border-radius: 8px; font: inherit; }
  input { width: 150px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
  .case { display: flex; flex-direction: column; margin: 0; }
  .case .top { display: flex; justify-content: space-between; gap: 12px; }
  .metric { text-align: right; flex-shrink: 0; }
  .metric b { display: block; font-size: 22px; line-height: 1.1; }
  .metric s, .metric span { color: var(--muted); font-size: 12px; }
  .case p { margin: 0 0 10px; color: var(--muted); }
  pre.diff { margin: 8px 0 0; padding: 10px; background: var(--bg); border-radius: 8px; overflow-x: auto; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; max-height: 520px; }
  .d-add { color: var(--good); background: var(--good-soft); } .d-del { color: var(--bad); background: var(--bad-soft); }
  .d-hunk { color: var(--accent); } .d-file { color: var(--muted); font-weight: 600; }
  dialog#diff-dialog { width: min(1000px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text); }
  dialog#diff-dialog::backdrop { background: rgba(0, 0, 0, .45); }
  .dlg-head { position: sticky; top: 0; display: flex; gap: 8px; align-items: center; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
  #diff-body { padding: 4px 16px 16px; }
  #diff-body pre.diff { max-height: none; }
  .dlg-head .btn { white-space: nowrap; }
  #diff-body code { word-break: break-all; }
  #diff-body section, #diff-body pre { max-width: 100%; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
  .tag { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  details summary { cursor: pointer; color: var(--accent); font-size: 13px; margin-top: 10px; }
  .empty { color: var(--muted); padding: 24px; text-align: center; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .err { color: var(--bad); }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } dl { grid-template-columns: 1fr; } }
  @media print {
    :root { --bg: #fff; --surface: #fff; }
    header, .filters, .actions, .no-print, details summary { display: none !important; }
    details { display: block; } details > * { display: block; }
    main { max-width: none; padding: 0; }
    .grid { grid-template-columns: 1fr 1fr; }
    .card { break-inside: avoid; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="logo">devflow</span>
    <nav aria-label="화면 선택">
      <button data-tab="today" class="on">오늘</button>
      <button data-tab="suggest">개선 제안</button>
      <button data-tab="jira">내 Jira</button>
      <button data-tab="work">작업 기록</button>
      <button data-tab="settings">설정</button>
    </nav>
    <span class="spacer"></span>
    <button class="btn" id="reload">새로고침</button>
  </div>
</header>
<main id="app" aria-live="polite"></main>
<div class="toast" id="toast" role="status"></div>
<dialog id="diff-dialog" aria-labelledby="diff-title">
  <div class="dlg-head">
    <h3 id="diff-title" style="margin:0">변경 내용</h3>
    <span class="spacer"></span>
    <button class="btn" id="diff-refresh">새로고침</button>
    <button class="btn" id="diff-close" aria-label="닫기">닫기</button>
  </div>
  <div id="diff-body"></div>
</dialog>

<script>
const STATUS = {
  proposed: "검토 대기", accepted: "채택 · Jira 생성 대기", rejected: "거절",
  ticketed: "Jira 생성됨", in_progress: "작업 중", done: "완료",
  committed: "커밋됨", pushed: "푸시됨", pr: "PR 올림", error: "오류"
};
const PRIORITY = { high: "높음", medium: "보통", low: "낮음" };
const ORDER = { high: 0, medium: 1, low: 2 };
const EFFORT = { S: 0, M: 1, L: 2 };
let data = { worklog: [], suggestions: [] };
// 선택한 탭은 주소의 #해시로 남겨 새로고침해도 유지한다
const TABS = ["today", "suggest", "jira", "work", "settings"];
let tab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "today";
let filter = { status: "proposed", category: "" };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const app = document.getElementById("app");

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 1800);
}

async function load() {
  try {
    const res = await fetch("/api/data");
    data = await res.json();
    render();
  } catch (e) {
    app.innerHTML = `<p class="err">데이터를 불러오지 못했습니다. 서버(python3 ~/Documents/Workspace/devflow/server.py)가 실행 중인지 확인하세요.</p>`;
  }
}

async function patch(id, body) {
  const res = await fetch(`/api/suggestions/${encodeURIComponent(id)}`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
  });
  const json = await res.json();
  if (!res.ok) { toast(json.error || "저장 실패"); return; }
  const i = data.suggestions.findIndex(s => s.id === id);
  if (i >= 0) data.suggestions[i] = json;
  render();
  toast("저장했습니다");
}

const topSuggestions = () => data.suggestions
  .filter(s => s.status === "proposed")
  .sort((a, b) => (ORDER[a.priority] ?? 3) - (ORDER[b.priority] ?? 3) || (EFFORT[a.effort] ?? 3) - (EFFORT[b.effort] ?? 3))
  .slice(0, 3);

function suggestionCard(s, compact = false) {
  const evidence = (s.evidence || []).map(e =>
    `<div><code>${esc(e.file)}${e.line ? ":" + esc(e.line) : ""}</code> ${esc(e.note)}</div>`).join("");
  const jira = s.jiraKey ? ` · <a href="${esc(data.jiraBase)}/browse/${esc(s.jiraKey)}" target="_blank" rel="noopener">${esc(s.jiraKey)}</a>` : "";
  return `<article class="card">
    <div class="meta">
      <span class="badge b-${esc(s.priority)}">${esc(PRIORITY[s.priority] || s.priority)}</span>
      <span class="badge">${esc(s.category)}</span>
      <span class="badge">규모 ${esc(s.effort)}</span>
      <span class="badge b-status">${esc(STATUS[s.status] || s.status)}</span>
      <span>${esc(s.id)}${jira}</span>
    </div>
    <h3>${esc(s.title)}</h3>
    <dl>
      <dt>문제</dt><dd>${esc(s.problem)}</dd>
      ${compact ? "" : `<dt>근거</dt><dd>${evidence || "-"}</dd>`}
      <dt>제안</dt><dd>${esc(s.proposal)}</dd>
      ${compact ? "" : `<dt>효과</dt><dd>${esc(s.impact)}</dd><dt>위험</dt><dd>${esc(s.risk || "-")}</dd>`}
    </dl>
    <div class="actions" data-id="${esc(s.id)}">
      ${s.status !== "accepted" && !s.jiraKey ? `<button class="btn primary" data-act="accept">채택</button>` : ""}
      ${s.status !== "rejected" ? `<button class="btn" data-act="reject">거절</button>` : ""}
      ${s.status !== "proposed" && !s.jiraKey ? `<button class="btn" data-act="reset">다시 검토</button>` : ""}
      <button class="btn" data-act="copy">Jira 초안 복사</button>
      <label class="no-print"><span class="visually-hidden" hidden>Jira 키</span>
        <input data-key placeholder="Jira 키 (PROJ-1234)" value="${esc(s.jiraKey || "")}" aria-label="생성한 Jira 키"></label>
      <button class="btn" data-act="key">키 저장</button>
    </div>
  </article>`;
}

function caseCard(w, index, total) {
  const m = w.metric;
  const kind = (w.kind || "APP").toUpperCase();
  return `<article class="card case">
    <div class="top">
      <div>
        <div class="meta">
          <span class="badge ${kind === "AX" ? "b-ax" : "b-app"}">${esc(kind)}</span>
          <span>CASE ${String(total - index).padStart(2, "0")} · ${esc(w.startedAt || "")}</span>
          <span class="badge b-status">${esc(STATUS[w.status] || w.status)}</span>
        </div>
        <h3>${esc(w.title)}</h3>
      </div>
      ${m ? `<div class="metric"><b>${esc(m.after)}</b><span>${esc(m.label)}</span><br><s>${esc(m.before)}</s></div>` : ""}
    </div>
    <p>${esc(w.summary || "")}</p>
    <div class="tags">${(w.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
    <details>
      <summary>자세히</summary>
      <dl>
        <dt>티켓</dt><dd><a href="${esc(w.url)}" target="_blank" rel="noopener">${esc(w.key)}</a></dd>
        <dt>브랜치</dt><dd><code>${esc(w.branch)}</code></dd>
        <dt>현상</dt><dd>${esc(w.problem || "-")}</dd>
        <dt>원인</dt><dd>${esc(w.cause || "-")}</dd>
        <dt>수정</dt><dd>${esc(w.change || "-")}</dd>
        <dt>확인</dt><dd>${esc((w.verification || []).join("\n") || "-")}</dd>
        <dt>파일</dt><dd>${(w.files || []).map(f => `<code>${esc(f)}</code>`).join("<br>") || "-"}</dd>
      </dl>
    </details>
  </article>`;
}

function renderToday() {
  const s = data.suggestions, w = data.worklog;
  const count = (arr, st) => arr.filter(x => st.includes(x.status)).length;
  const active = w.filter(x => x.status === "in_progress");
  const top = topSuggestions();
  app.innerHTML = `
    <div class="tiles">
      <div class="tile"><b>${active.length}</b><span>진행 중 작업</span></div>
      <div class="tile"><b>${count(s, ["proposed"])}</b><span>검토 대기 제안</span></div>
      <div class="tile"><b>${count(s, ["accepted"])}</b><span>Jira 생성 대기</span></div>
      <div class="tile"><b>${count(w, ["done", "committed", "pushed", "pr"])}</b><span>완료한 작업</span></div>
    </div>
    <h2>진행 중 작업</h2>
    ${active.length ? `<div class="grid">${active.map((x, i) => caseCard(x, i, active.length)).join("")}</div>`
      : `<div class="empty">진행 중인 작업이 없습니다. Claude 에서 <code>/jira &lt;URL&gt;</code> 로 시작하세요.</div>`}
    <h2>오늘 검토할 제안</h2>
    ${top.length ? top.map(x => suggestionCard(x, true)).join("")
      : `<div class="empty">검토 대기 제안이 없습니다. Claude 에서 <code>/suggest</code> 로 만들 수 있습니다.</div>`}`;
}

function renderSuggest() {
  const cats = [...new Set(data.suggestions.map(s => s.category).filter(Boolean))].sort();
  const list = data.suggestions.filter(s =>
    (!filter.status || s.status === filter.status) && (!filter.category || s.category === filter.category));
  const chips = [["proposed", "검토 대기"], ["accepted", "채택"], ["ticketed", "Jira 생성됨"], ["in_progress", "작업 중"], ["done", "완료"], ["rejected", "거절"], ["", "전체"]];
  app.innerHTML = `
    <section class="card" aria-labelledby="run-title">
      <h3 id="run-title">제안 만들기</h3>
      <div class="filters" style="margin:8px 0 4px">
        <select id="run-cat" aria-label="분석 카테고리"><option value="">카테고리 자동 선택</option>${(data.categories || []).map(c => `<option>${esc(c)}</option>`).join("")}</select>
        <input id="run-scope" style="width:280px;max-width:100%" placeholder="범위 (선택) 예: 상품상세, app/src/.../feature" aria-label="분석 범위" maxlength="150">
        <button class="btn primary" id="run-start">제안 만들기</button>
      </div>
      <p class="meta" id="run-status" role="status"></p>
      <p class="meta">코드를 읽기만 하고 수정하지 않습니다 · 보통 수 분~수십 분 · 선택한 AI 서비스의 사용량이 발생합니다</p>
    </section>
    <div class="filters">
      ${chips.map(([v, l]) => `<button class="chip ${filter.status === v ? "on" : ""}" data-status="${v}">${l} ${v ? data.suggestions.filter(s => s.status === v).length : data.suggestions.length}</button>`).join("")}
      <select id="cat" aria-label="카테고리"><option value="">모든 카테고리</option>${cats.map(c => `<option ${filter.category === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
    </div>
    ${list.length ? list.map(x => suggestionCard(x)).join("") : `<div class="empty">해당하는 제안이 없습니다.</div>`}`;
  showRun();
}

// ---------- 제안 생성 실행 상태 ----------
let run = { status: "idle" };
let pollTimer = null;
const mins = sec => sec < 60 ? `${Math.round(sec)}초` : `${Math.floor(sec / 60)}분 ${Math.round(sec % 60)}초`;

function showRun() {
  const el = document.getElementById("run-status"), btn = document.getElementById("run-start");
  if (!el) return;
  const running = run.status === "running";
  btn.disabled = running;
  btn.textContent = running ? "분석 중…" : "제안 만들기";
  if (running) el.textContent = `분석 중 · ${mins(Date.now() / 1000 - run.startedAt)} 경과 · 범위: ${run.scope || "자동"}`;
  else if (run.status === "done") el.textContent = `마지막 실행: ${(run.added || []).length}건 추가 · ${mins(run.finishedAt - run.startedAt)} 소요${run.cost ? ` · $${run.cost.toFixed(2)}` : ""}`;
  else if (run.status === "error") el.innerHTML = `<span class="err">실패: ${esc(run.error)}</span>`;
  else el.textContent = "";
}

async function pollRun() {
  const prev = run.status;
  try { run = await (await fetch("/api/suggest/status")).json(); } catch { return; }
  if (run.status === "running") {
    if (!pollTimer) pollTimer = setInterval(pollRun, 4000);
  } else {
    clearInterval(pollTimer); pollTimer = null;
    if (prev === "running") {
      if (run.status === "done") { toast(`제안 ${(run.added || []).length}건을 추가했습니다`); filter.status = "proposed"; }
      await load();
    }
  }
  showRun();
}

async function startRun() {
  const scope = [document.getElementById("run-cat").value, document.getElementById("run-scope").value.trim()].filter(Boolean).join(" / ");
  const res = await fetch("/api/suggest", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ scope }) });
  const json = await res.json();
  if (!res.ok) return toast(json.error || "시작 실패");
  run = json; showRun(); pollRun();
}

function renderWork() {
  const w = data.worklog;
  app.innerHTML = `
    <div class="filters"><span class="meta">${w.length}건</span><span class="spacer"></span>
      <button class="btn" id="print">PDF로 저장 (인쇄)</button></div>
    ${w.length ? `<div class="grid">${w.map((x, i) => caseCard(x, i, w.length)).join("")}</div>`
      : `<div class="empty">아직 작업 기록이 없습니다. <code>/jira</code> 로 작업하면 자동으로 쌓입니다.</div>`}`;
}

// ---------- 내 Jira ----------
let jira = null, jiraFilter = "";
try { jiraFilter = localStorage.getItem("devflow.jstatus") || ""; } catch {}
function setJiraFilter(v) { jiraFilter = v; try { localStorage.setItem("devflow.jstatus", v); } catch {} }
// 생성일 기간: 마지막 선택을 이 브라우저에 기억 (저장소를 못 쓰면 기본값 '전체')
let period = { field: "created", preset: "all", from: "", to: "" };
try { period = { ...period, ...JSON.parse(localStorage.getItem("devflow.period") || "{}") }; } catch {}
const PERIODS = [["all", "전체"], ["7", "최근 1주"], ["14", "최근 2주"], ["30", "최근 1달"], ["90", "최근 3달"], ["custom", "직접 입력"]];
const ymd = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
function periodRange() {
  if (period.preset === "custom") return { from: period.from, to: period.to };
  if (period.preset === "all") return { from: "", to: "" };
  const d = new Date(); d.setDate(d.getDate() - Number(period.preset) + 1);
  return { from: ymd(d), to: "" };
}
function setPeriod(patch) {
  period = { ...period, ...patch };
  try { localStorage.setItem("devflow.period", JSON.stringify(period)); } catch {}
  setJiraFilter("");
  renderJira(true);
}
async function renderJira(refresh = false) {
  if (!jira || refresh) {
    app.innerHTML = `<p class="meta">Jira 에서 불러오는 중…</p>`;
    try {
      const r = periodRange();
      const res = await fetch(`/api/jira/mine?${new URLSearchParams({ field: period.field, from: r.from || "", to: r.to || "" })}`);
      const json = await res.json();
      jira = res.ok ? json : { error: json.error || "불러오기 실패", items: [] };
    } catch { jira = { error: "서버에 연결하지 못했습니다", items: [] }; }
    if (tab !== "jira") return;
  }
  const statuses = [...new Set(jira.items.map(i => i.status))];
  if (jiraFilter && !jira.items.some(i => i.status === jiraFilter)) setJiraFilter("");  // 기억한 상태가 목록에 없으면 전체로
  const list = jira.items.filter(i => !jiraFilter || i.status === jiraFilter);
  app.innerHTML = `
    <div class="filters">
      <button class="chip ${jiraFilter ? "" : "on"}" data-jstatus="">전체 ${jira.items.length}</button>
      ${statuses.map(st => `<button class="chip ${jiraFilter === st ? "on" : ""}" data-jstatus="${esc(st)}">${esc(st)} ${jira.items.filter(i => i.status === st).length}</button>`).join("")}
      <span class="spacer"></span>
      <button class="btn" id="jira-refresh">Jira 다시 불러오기</button>
    </div>
    <div class="filters">
      <select id="period-field" aria-label="기간 기준">
        <option value="created" ${period.field === "created" ? "selected" : ""}>생성일</option>
        <option value="updated" ${period.field === "updated" ? "selected" : ""}>업데이트일</option>
      </select>
      <select id="period" aria-label="기간">${PERIODS.map(([v, l]) => `<option value="${v}" ${period.preset === v ? "selected" : ""}>${l}</option>`).join("")}</select>
      ${period.preset === "custom" ? `
        <input type="date" id="period-from" aria-label="시작일" value="${esc(period.from)}" max="${ymd(new Date())}">
        <span class="meta">~</span>
        <input type="date" id="period-to" aria-label="종료일" value="${esc(period.to)}" max="${ymd(new Date())}">` : ""}
      <span class="meta">${(() => { const r = periodRange(); return r.from || r.to ? `${r.from || "처음"} ~ ${r.to || "오늘"} 에 ${period.field === "updated" ? "업데이트된" : "생성된"} 티켓` : "기간 제한 없음"; })()}</span>
      ${period.preset !== "all" ? `<button class="btn" id="period-clear">조건 지우기</button>` : ""}
    </div>
    ${jira.error ? `<p class="err">${esc(jira.error)}</p>` : ""}
    <section class="card" aria-labelledby="work-title">
      <h3 id="work-title">자동 작업</h3>
      <div id="work-status" role="status"></div>
      <p class="meta" style="margin-top:10px">작업: 남은 수정 stash → 기준 브랜치에서 티켓 브랜치 → 구현·빌드 확인·작업 기록 (커밋·푸시·PR 없음, 1회 최대 $20) · 분석: 코드 수정 없이 원인·수정 방안만 (1회 최대 $5) · 누른 순서대로 하나씩 실행</p>
    </section>
    <p class="meta" style="margin-bottom:12px">${jira.projects?.length ? `프로젝트 ${esc(jira.projects.join(", "))} · ` : "모든 프로젝트 · "}나에게 할당된 미완료 티켓 · 읽기 전용 · 프로젝트는 설정 탭에서 바꿉니다</p>
    ${list.length ? list.map(i => `
      <div class="card">
        <div class="meta">
          <span class="badge b-status">${esc(i.status)}</span>
          <span class="badge">${esc(i.type)}</span>
          ${i.priority ? `<span>${esc(i.priority)}</span>` : ""}
          ${i.hasWorklog ? `<span class="badge b-app">작업 기록 있음</span>` : ""}
          ${i.analysis ? `<span class="badge b-ax">분석 있음</span>` : ""}
          <span>생성 ${esc(i.created)} · 업데이트 ${esc(i.updated)}</span>
        </div>
        <h3><a href="${esc(i.url)}" target="_blank" rel="noopener"${jira.highlight?.includes(i.project) ? ` style="color:var(--bad)"` : ""}>${esc(i.key)}</a> ${esc(i.summary)}</h3>
        ${i.analysis ? `<details style="margin-top:8px"><summary>분석 결과</summary><div style="white-space:pre-wrap;margin-top:6px">${esc(i.analysis)}</div></details>` : ""}
        <div class="actions">
          <button class="btn primary" data-job="work:${esc(i.key)}"${jira.highlight?.includes(i.project) ? ` style="background:var(--bad);border-color:var(--bad)"` : ""}>작업 시작</button>
          <button class="btn" data-job="analyze:${esc(i.key)}">분석만</button>
          ${i.hasBranch ? `<button class="btn" data-changes="${esc(i.key)}">변경 내용</button>` : ""}
        </div>
      </div>`).join("") : (jira.error ? "" : `<div class="empty">미완료 티켓이 없습니다.</div>`)}`;
  showJobs();
}

// ---------- 작업 대기열·진행 상태 ----------
let jobs = { current: { status: "idle" }, queue: [], history: [] }, jobsTimer = null;
const MODE = { work: "작업", analyze: "분석" };
const PHASES = { work: ["티켓 읽기", "브랜치 준비", "코드 분석", "코드 수정", "빌드 확인", "작업 기록"], analyze: ["티켓 읽기", "코드 분석"] };
const busy = () => jobs.current.status === "running";

function jobButtons() {
  document.querySelectorAll("[data-job]").forEach(b => {
    const [mode, key] = b.dataset.job.split(":");
    const cur = busy() && jobs.current.key === key && jobs.current.mode === mode;
    const queued = jobs.queue.some(j => j.key === key && j.mode === mode);
    b.disabled = cur || queued;
    b.textContent = cur ? `${MODE[mode]} 중…` : queued ? "대기 중" : (busy() || jobs.queue.length) ? `${mode === "work" ? "작업" : "분석"} 대기열에 추가` : (mode === "work" ? "작업 시작" : "분석만");
  });
}

function stepsHtml(w, running) {
  const steps = w.steps || [], seen = new Set(steps.map(s => s.phase));
  const track = (PHASES[w.mode] || PHASES.work).map(p => {
    const cur = running && w.phase === p, done = seen.has(p) && !cur;
    return `<span class="badge ${cur ? "b-app" : done ? "b-low" : "b-status"}">${done ? "✓ " : cur ? "▶ " : ""}${esc(p)}</span>`;
  }).join(" ");
  const recent = steps.slice(-6).reverse().map(s =>
    `<li><span class="meta">${new Date(s.t * 1000).toLocaleTimeString("ko-KR", { hour12: false })}</span> ${esc(s.phase)} · <code>${esc(s.detail)}</code></li>`).join("");
  return `<div style="margin-top:8px">${track}</div>` + (recent ? `<ul style="margin:8px 0 0;padding-left:18px">${recent}</ul>` : "");
}

function resultHead(h) {
  return `${h.key} ${MODE[h.mode] || "작업"} ${h.status === "done" ? "끝" : h.status === "blocked" ? "확인 필요" : "실패"} · ${mins(h.finishedAt - h.startedAt)}${h.cost ? ` · $${h.cost.toFixed(2)}` : ""}`;
}

function showJobs() {
  jobButtons();
  const el = document.getElementById("work-status");
  if (!el) return;
  const c = jobs.current;
  let html = busy()
    ? `<b>${esc(c.key)} ${MODE[c.mode]} 중 · ${mins(Date.now() / 1000 - c.startedAt)} 경과${c.edits ? ` · 코드 수정 ${c.edits}회` : ""}</b>
       ${c.stashed ? `<p class="meta">이전 수정 보관함: ${esc(c.stashed)}</p>` : ""}
       ${stepsHtml(c, true)}${(c.steps || []).length ? "" : `<p class="meta">시작하는 중… (첫 단계까지 수십 초 걸릴 수 있음)</p>`}`
    : `<span>실행 중인 작업이 없습니다.</span>`;
  if (jobs.queue.length) html += `<h4 style="margin:14px 0 6px">대기열 ${jobs.queue.length}</h4><ol style="margin:0;padding-left:20px">${jobs.queue.map(j =>
    `<li style="margin-bottom:4px">${esc(j.key)} · ${MODE[j.mode]}${j.auto ? ` <span class="badge b-ax">자동</span>` : ""} <button class="btn" style="padding:2px 8px" data-jremove="${j.id}">빼기</button></li>`).join("")}</ol>`;
  if (jobs.history.length) html += `<h4 style="margin:14px 0 6px">최근 결과</h4>` + jobs.history.map((h, i) => `
    <details ${i === 0 && !busy() ? "open" : ""} style="margin-bottom:6px"><summary><b>${esc(resultHead(h))}</b></summary>
      ${h.stashed ? `<p class="meta">시작 전 보관: ${esc(h.stashed)}</p>` : ""}
      ${h.error ? `<p class="err">${esc(h.error)}</p>` : ""}
      ${h.message ? `<div style="margin-top:6px;color:var(--text);white-space:pre-wrap">${esc(h.message)}</div>` : ""}
    </details>`).join("");
  el.innerHTML = html;
}

// ---------- 티켓별 변경 내용 팝업 ----------
let diffKey = null;
function diffHtml(text) {
  return text.split("\n").map(l => {
    const cls = l.startsWith("+++") || l.startsWith("---") || l.startsWith("diff ") || l.startsWith("index ") || l.startsWith("new file") ? "d-file"
      : l.startsWith("+") ? "d-add" : l.startsWith("-") ? "d-del" : l.startsWith("@@") ? "d-hunk" : "";
    return `<span class="${cls}">${esc(l)}</span>`;
  }).join("\n");
}
async function openChanges(key) {
  const dlg = document.getElementById("diff-dialog");
  diffKey = key;
  document.getElementById("diff-title").textContent = `${key} 변경 내용`;
  const body = document.getElementById("diff-body");
  if (!dlg.open) { body.innerHTML = `<p class="meta">불러오는 중…</p>`; dlg.showModal(); }
  let c;
  try { c = await (await fetch(`/api/changes/${encodeURIComponent(key)}`)).json(); }
  catch { body.innerHTML = `<p class="err">서버에 연결하지 못했습니다</p>`; return; }
  if (diffKey !== key) return;
  if (c.error) { body.innerHTML = `<p class="err">${esc(c.error)}</p>`; return; }
  const running = busy() && jobs.current.key === key && jobs.current.mode === "work";
  body.innerHTML = `
    <p class="meta">브랜치 <code>${esc(c.branch)}</code>${c.current ? " · 작업 폴더에 체크아웃됨" : ""}${c.heldBy ? ` · <b>내 폴더(${esc(c.heldBy)})에 가져와 있음</b> — 빌드·커밋은 Android Studio 에서` : ""}${running ? " · 작업 중 (5초마다 갱신)" : ""} · 서브모듈 포인터 제외</p>
    ${!c.exists ? `<p>아직 이 티켓의 브랜치가 없습니다.</p>` : !c.sections.length ? `<p>변경 사항이 없습니다.</p>` : c.sections.map(s => {
      const files = [...s.diff.matchAll(/^diff --git a\/(.+?) b\//gm)].map(m => m[1]);
      const stashRef = (s.title.match(/stash@\{\d+\}/) || [])[0];
      const off = busy() || jobs.queue.length ? "disabled" : "";
      const bring = `<button class="btn primary" data-bring="${esc(stashRef || "")}" ${off}>내 폴더로 가져오기</button>`;
      const action = stashRef ? `${bring}<button class="btn" data-restore="${esc(stashRef)}" ${off}>작업 폴더로 꺼내기</button>`
        : s.title.startsWith("커밋 안 된") ? `${bring}<button class="btn" data-commit="${esc(key)}" ${off}>커밋·푸시·PR…</button>` : "";
      return `<section style="margin-top:14px">
        <h4 style="margin:0 0 4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">${esc(s.title)} · 파일 ${files.length}개${s.truncated ? " (일부만 표시)" : ""} ${action}</h4>
        ${s.note ? `<pre class="meta" style="margin:0 0 6px;white-space:pre-wrap">${esc(s.note)}</pre>` : ""}
        ${files.length ? `<ul style="margin:0 0 6px;padding-left:18px">${files.map(f => `<li><code>${esc(f)}</code></li>`).join("")}</ul>` : ""}
        ${s.diff ? `<pre class="diff">${diffHtml(s.diff)}</pre>` : ""}
      </section>`;
    }).join("")}`;
}

// ---------- 커밋·푸시·PR (사용자가 직접 누를 때만) ----------
async function postJson(path, body) {
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  let json = {};
  try { json = await res.json(); } catch {}
  return res.ok ? json : { error: json.error || "실패" };
}

async function openCommit(key) {
  const body = document.getElementById("diff-body");
  body.innerHTML = `<p class="meta">커밋할 내용을 준비하는 중…</p>`;
  const p = await postJson("/api/commit/preview", { key });
  if (p.error) { body.innerHTML = `<p class="err">${esc(p.error)}</p><button class="btn" data-back="${esc(key)}">돌아가기</button>`; return; }
  body.innerHTML = `
    <h4 style="margin:12px 0 4px">${esc(key)} 커밋·푸시·PR</h4>
    <p class="meta">브랜치 <code>${esc(p.branch)}</code> · 전용 작업 폴더에서 실행 · 누를 때만 실행되고 자동으로는 하지 않습니다</p>
    <p style="margin:10px 0 4px"><b>커밋할 파일</b></p>
    <ul style="margin:0;padding-left:0;list-style:none">${p.files.map(f => `<li><label><input type="checkbox" name="cfile" value="${esc(f.path)}" checked style="width:auto"> <code>${esc(f.status)}</code> ${esc(f.path)}</label></li>`).join("")}</ul>
    <p style="margin:10px 0 4px"><label for="c-msg"><b>커밋 메시지</b></label> <span class="meta">설정의 커밋 메시지 형식으로 만든 초안 · 고쳐도 됩니다</span></p>
    <textarea id="c-msg" rows="9" style="width:100%;font:12px/1.45 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--text)">${esc(p.message)}</textarea>
    <label style="display:block;margin-top:8px"><input type="checkbox" id="c-push" checked style="width:auto"> 커밋 후 <code>${esc(p.remote)}</code> 에 푸시</label>
    <p class="meta">${p.prUrl ? "푸시가 되면 PR 만들기 링크를 보여줍니다." : "PR 주소 형식이 설정돼 있지 않아 PR 링크는 만들지 않습니다 (설정 탭)."}</p>
    <div class="actions"><button class="btn primary" id="c-run" data-key="${esc(key)}">커밋 실행</button><button class="btn" data-back="${esc(key)}">취소</button></div>
    <div id="c-result" role="status"></div>`;
}

async function runCommit(key) {
  const files = [...document.querySelectorAll('input[name="cfile"]:checked')].map(c => c.value);
  const message = document.getElementById("c-msg").value;
  const push = document.getElementById("c-push").checked;
  if (!files.length) return toast("커밋할 파일을 고르세요");
  if (!confirm(`${key} 변경 ${files.length}개 파일을 커밋${push ? "하고 푸시" : ""}할까요?`)) return;
  const btn = document.getElementById("c-run"); btn.disabled = true; btn.textContent = "실행 중…";
  const r = await postJson("/api/commit", { key, message, files, push });
  const out = document.getElementById("c-result");
  btn.disabled = false; btn.textContent = "커밋 실행";
  if (r.error) { out.innerHTML = `<p class="err">${esc(r.error)}</p>`; return; }
  out.innerHTML = `<p>커밋 <code>${esc(r.commit)}</code> 완료${r.pushed ? ` · <code>${esc(r.branch)}</code> 푸시 완료` : ""}</p>
    ${r.pushError ? `<p class="err">푸시 실패: ${esc(r.pushError)}<br>커밋은 남아 있습니다. 터미널에서 직접 푸시하세요.</p>` : ""}
    ${r.prUrl ? `<a class="btn primary" href="${esc(r.prUrl)}" target="_blank" rel="noopener">PR 만들기 열기</a>` : ""}`;
  btn.remove();
  toast("커밋했습니다");
  load();
}

async function bringToMine(key, ref) {
  if (!confirm(`${key} 작업을 내 소스 폴더로 가져올까요?\n내 폴더가 ${key} 브랜치로 바뀌고 수정 내용이 옮겨집니다.\n(내 폴더에 커밋 안 된 수정이 있으면 거절됩니다. Android Studio 는 Gradle sync 가 다시 돌 수 있습니다)`)) return;
  const r = await postJson("/api/bring", ref ? { key, ref } : { key });
  if (r.error) return toast(r.error);
  toast(`내 폴더(${r.repo})를 ${r.branch} 로 바꾸고 작업을 옮겼습니다`);
  openChanges(key);
}

async function restoreStash(key, ref) {
  if (!confirm(`${key} 보관분(${ref})을 전용 작업 폴더로 꺼낼까요?\n작업 폴더가 ${key} 브랜치로 전환됩니다.`)) return;
  const r = await postJson("/api/stash/restore", { key, ref });
  if (r.error) return toast(r.error);
  toast("작업 폴더로 꺼냈습니다");
  openChanges(key);
}

async function pollJobs() {
  const prevDone = jobs.history[0]?.finishedAt;
  try {
    jobs = await (await fetch("/api/jobs")).json();
  } catch { return; }
  const dlg = document.getElementById("diff-dialog");
  if (dlg.open && diffKey && (jobs.current.key === diffKey || jobs.history[0]?.key === diffKey)) openChanges(diffKey);
  const active = busy() || jobs.queue.length;
  if (active && !jobsTimer) jobsTimer = setInterval(pollJobs, 5000);
  if (!active && jobsTimer) { clearInterval(jobsTimer); jobsTimer = null; }
  const last = jobs.history[0];
  if (prevDone !== undefined && last && last.finishedAt !== prevDone) {
    toast(resultHead(last));
    await load();
    if (tab === "jira") return renderJira(true);
  }
  showJobs();
}

async function addJob(mode, key) {
  if (mode === "work" && !confirm(`${key} 작업을 ${busy() || jobs.queue.length ? "대기열에 추가할까요" : "시작할까요"}?\n\ndevflow 전용 작업 폴더에서 남은 수정을 stash 로 보관하고, ${key} 티켓 브랜치로 전환해 코드를 수정합니다.\n개발 중인 소스 폴더는 건드리지 않습니다. 커밋·푸시는 하지 않습니다.`)) return;
  const res = await fetch("/api/jobs", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key, mode }) });
  const json = await res.json();
  if (!res.ok) return toast(json.error || "추가 실패");
  toast(json.position > 1 ? `대기열 ${json.position - 1}번째에 넣었습니다` : `${key} ${MODE[mode]}을 시작합니다`);
  await pollJobs();
}

async function removeJob(id) {
  const res = await fetch("/api/jobs/remove", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id }) });
  const json = await res.json();
  toast(res.ok ? "대기열에서 뺐습니다" : json.error || "실패");
  await pollJobs();
}

    <section class="card" aria-labelledby="jira-title" style="max-width:560px">

      <p class="meta">devflow/.env 에 저장합니다 (본인만 읽기 가능). 토큰은 화면에 다시 표시하지 않습니다.</p>
      <form id="jira-form" autocomplete="off">
        <dl style="grid-template-columns:90px 1fr;align-items:center">
          <dt><label for="j-email">이메일</label></dt>
          <dd><input id="j-email" type="email" required style="width:100%" value="${esc(j.email)}"></dd>

async function renderEngine(state) {
  const el = document.getElementById("engine-card");
  if (!el) return;
  let s = state;
  if (!s) { try { s = await (await fetch("/api/engine")).json(); } catch { s = { error: "서버에 연결하지 못했습니다" }; } }
  if (s.error) { el.innerHTML = `<h3 id="engine-title">실행 엔진</h3><p class="err">${esc(s.error)}</p>`; return; }
  const row = (key, e) => `
    <label style="display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid ${s.engine === key ? "var(--accent)" : "var(--line)"};border-radius:8px;margin-bottom:6px;cursor:pointer">
      <input type="radio" name="engine" value="${key}" ${s.engine === key ? "checked" : ""} style="width:auto">
      <b>${esc(e.name)}</b>
      <span class="badge ${e.installed ? "b-low" : "b-high"}">${e.installed ? "설치됨" : "설치 안 됨"}</span>
      ${e.version ? `<span class="meta">${esc(e.version)}</span>` : ""}
      ${e.supported ? "" : `<span class="badge b-medium">실행 연결 전</span>`}
    </label>`;
  const cur = s.engines[s.engine];
  el.innerHTML = `
    <h3 id="engine-title">실행 엔진</h3>
    <p class="meta">작업 시작·분석·제안 만들기·자동 작업을 어떤 AI 로 실행할지 고릅니다. 비용은 고른 서비스 계정으로 나갑니다.</p>
    <div role="radiogroup" aria-label="실행 엔진" style="margin-top:8px">${Object.entries(s.engines).map(([k, e]) => row(k, e)).join("")}</div>
    ${!cur.supported ? `<p class="err">${esc(cur.name)} 는 아직 실행이 연결되지 않아, 이 상태에서는 작업·분석·제안이 시작되지 않습니다.</p>`
      : !cur.installed ? `<p class="err">${esc(cur.name)} CLI 가 설치돼 있지 않습니다.</p>` : s.engine === "codex" ? `<p class="meta">서버 실행 계정의 Codex CLI 로그인을 사용합니다. 분석은 읽기 전용이며, 작업은 전용 폴더에서 실행합니다. Codex 실행에는 달러 비용 상한이 적용되지 않습니다.</p>` : ""}`;
}

function setPanel(html) { projectPanel = html; const el = document.getElementById("p-panel"); if (el) el.innerHTML = html; }

async function projectCall(path, body) {
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  let json = {};
  try { json = await res.json(); } catch {}
  if (!res.ok) { toast(json.error || "실패"); return null; }
  return json;
}

async function autoCall(path, body) {
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  const json = await res.json();
  if (!res.ok) { toast(json.error || "실패"); return renderAuto(); }
  renderAuto(json);
  pollJobs();
}

async function jiraCall(path, body) {
  const st = document.getElementById("j-status");
  st.textContent = "확인 중…";
  try {
    const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
    const json = await res.json();
    if (!res.ok) { st.innerHTML = `<span class="err">${esc(json.error || "실패")}</span>`; return null; }
    return json;
  } catch { st.innerHTML = `<span class="err">서버에 연결하지 못했습니다</span>`; return null; }
}

app.addEventListener("click", async e => {
  if (e.target.id === "print") return window.print();
  const go = e.target.closest("[data-goto]");
  if (go) { tab = go.dataset.goto; history.replaceState(null, "", `#${tab}`); return render(); }
  if (e.target.id === "run-start") return startRun();
  if (e.target.id === "jira-refresh") return renderJira(true);
  if (e.target.id === "auto-check") { e.target.disabled = true; return autoCall("/api/auto/check"); }
  if (e.target.id === "p-cands") return showCandidates();
  if (e.target.id === "p-pick") {
    e.target.disabled = true;
    setPanel(`<p class="meta">Mac 화면에 열린 Finder 폴더 선택 창에서 소스 폴더를 고르세요. (브라우저 뒤에 열릴 수 있어요)</p>`);
    const r = await projectCall("/api/project/pick", { start: document.getElementById("p-repo").value.trim() });
    e.target.disabled = false;
    if (r?.path) { document.getElementById("p-repo").value = r.path; setPanel(`<p class="meta">선택했습니다. <b>저장</b>을 눌러 적용하세요.</p>`); }
    else setPanel("");
    return;
  }
  if (e.target.id === "p-remote") {
    setPanel(`<p class="meta">원격 저장소에 접속해 보는 중… (최대 1분)</p>`);
    const r = await postJson("/api/project/remote-check", {});
    if (r.error) return setPanel(`<p class="err">${esc(r.error)}</p>`);
    const where = r.url ? ` <code style="word-break:break-all">${esc(r.url)}</code> (${r.seconds}초)` : "";
    return setPanel(`<p class="${r.ok && r.baseFound !== false ? "" : "err"}">${r.ok ? "✓ 원격 접속 OK" : "✗ 원격 접속 실패"} · ${esc(r.remote)}${where}</p>
      ${r.hints.length ? `<pre class="meta" style="white-space:pre-wrap;user-select:all">${esc(r.hints.join("\n"))}</pre>` : ""}
      ${r.detail ? `<details><summary class="meta">git 메시지</summary><pre class="meta" style="white-space:pre-wrap">${esc(r.detail)}</pre></details>` : ""}`);
  }
  if (e.target.id === "p-save" || e.target.id === "p-check") {
    const btn = e.target; btn.disabled = true;
    setPanel(`<p class="meta">전용 작업 폴더를 준비하는 중… (처음 만들 때는 1분 이상 걸릴 수 있어요)</p>`);
    const r = btn.id === "p-save"
      ? await projectCall("/api/project", { repo: document.getElementById("p-repo").value.trim(), branchPrefix: document.getElementById("p-prefix").value.trim(),
          baseRef: document.getElementById("p-base").value.trim(), categories: document.getElementById("p-cats").value.trim(),
          buildCmd: document.getElementById("p-build").value.trim(), commitTemplate: document.getElementById("p-commit").value,
          prUrl: document.getElementById("p-pr").value.trim() })
      : await projectCall("/api/project/setup", {});
    btn.disabled = false;
    if (!r) return setPanel("");
    toast(btn.id === "p-save" ? "저장했습니다" : "점검했습니다");
    return showLog(r);
  }
  const pp = e.target.closest("[data-ppick]");
  if (pp) {
    document.getElementById("p-repo").value = pp.dataset.ppick;
    setPanel(`<p class="meta">선택했습니다. <b>저장</b>을 눌러 적용하세요.</p>`);
    return;
  }
  if (e.target.closest("[data-pclose]")) return setPanel("");
  if (e.target.id === "period-clear") return setPeriod({ preset: "all", from: "", to: "" });
  const jb = e.target.closest("[data-job]");
  if (jb) { const [mode, key] = jb.dataset.job.split(":"); return addJob(mode, key); }
  const ch = e.target.closest("[data-changes]");
  if (ch) return openChanges(ch.dataset.changes);
  const jr = e.target.closest("[data-jremove]");
  if (jr) return removeJob(Number(jr.dataset.jremove));
  const jchip = e.target.closest("[data-jstatus]");
  if (jchip) { setJiraFilter(jchip.dataset.jstatus); return renderJira(); }
  if (e.target.id === "j-test") {
    const ok = await jiraCall("/api/jira/test");
    if (ok) document.getElementById("j-status").textContent = `연결 성공: ${ok.name || "확인됨"}`;
    return;
  }
  const chip = e.target.closest("[data-status]");
  if (chip) { filter.status = chip.dataset.status; return render(); }
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const box = btn.closest(".actions"), id = box.dataset.id;
  const s = data.suggestions.find(x => x.id === id);
  const act = btn.dataset.act;
  if (act === "accept") patch(id, { status: "accepted" });
  if (act === "reject") patch(id, { status: "rejected" });
  if (act === "reset") patch(id, { status: "proposed" });
  if (act === "key") patch(id, { jiraKey: box.querySelector("[data-key]").value });
  if (act === "copy") {
    const d = s.jiraDraft || {};
    try { await navigator.clipboard.writeText(`${d.summary || s.title}\n\n${d.description || ""}`); toast("Jira 초안을 복사했습니다"); }
    catch { toast("복사 실패: 브라우저 권한을 확인하세요"); }
  }
});
app.addEventListener("change", async e => {
  if (e.target.id === "cat") { filter.category = e.target.value; render(); }
  if (e.target.id === "period") setPeriod({ preset: e.target.value });
  if (e.target.id === "period-field") setPeriod({ field: e.target.value });
  if (e.target.id === "period-from") setPeriod({ from: e.target.value });
  if (e.target.id === "period-to") setPeriod({ to: e.target.value });
  if (e.target.id === "auto-on") {
    if (e.target.checked && !confirm(`${document.getElementById("auto-project").value.trim() || "지정 프로젝트"} 자동 작업을 켤까요?\n\n지금 할당된 티켓은 건너뛰고, 이후 새로 할당되는 티켓을 자동으로 작업합니다.\n1건당 최대 $20, 하루 상한까지 비용이 자동으로 나갑니다.`)) { e.target.checked = false; return; }
    autoCall("/api/auto", { enabled: e.target.checked, project: document.getElementById("auto-project").value });
  }
  if (e.target.id === "auto-limit") autoCall("/api/auto", { dailyLimit: e.target.value });
  if (e.target.id === "auto-project") autoCall("/api/auto", { project: e.target.value });
  if (e.target.name === "engine") {
    const res = await fetch("/api/engine", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ engine: e.target.value }) });
    const json = await res.json();
    if (!res.ok) toast(json.error || "저장 실패"); else toast("실행 엔진을 바꿨습니다");
    renderEngine(res.ok ? json : undefined);
  }
});

load().then(pollRun).then(pollJobs);
</script>
</body>
</html>
